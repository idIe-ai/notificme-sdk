# Publishes @notificme/sdk to npm when a `ts-v<version>` tag is pushed.
#
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN secret. On npmjs.com, under
# the package settings → Trusted publishers, add GitHub Actions with:
#   organization/user: idIe-ai   repository: notificme-sdk
#   workflow filename: publish-npm.yml   environment: npm
name: publish-npm

on:
  push:
    tags: ["ts-v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing and provenance
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # ships npm 11, required for trusted publishing
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#ts-v}"
          pkg=$(node -p "require('./package.json').version")
          [ "$tag" = "$pkg" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json $pkg"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) npm publish --provenance --access public --tag next ;;
            *) npm publish --provenance --access public ;;
          esac
